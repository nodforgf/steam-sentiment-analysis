services:
  - type: web
    name: steam-sentiment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_tfidf.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SENTIMENT_BACKEND
        value: tfidf
      - key: DEEPL_API_KEY
        sync: false
